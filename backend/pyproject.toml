[project]
name = "infraresearch"
version = "0.1.1"
description = "Explainable agentic RAG for infrastructure research"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "fastembed>=0.8,<1",
  "httpx[socks]>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.12,<1",
  "qdrant-client>=1.12,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infraresearch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["gpu: requires a configured local GPU model server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
