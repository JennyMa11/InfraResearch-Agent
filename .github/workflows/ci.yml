name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --extra dev --locked
      - run: npm --prefix frontend ci
      - run: INFRARESEARCH_VECTOR_BACKEND=sqlite uv run --project backend pytest backend/tests
      - run: uv run --project backend ruff check backend scripts/evaluate.py
      - run: npm --prefix frontend test -- --run
      - run: npm --prefix frontend run build
      - run: uv run --project backend python scripts/evaluate.py
